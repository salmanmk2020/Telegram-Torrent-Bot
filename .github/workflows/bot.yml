name: torrent-bot

on:
  schedule:
    # هر ۳ ساعت. GitHub ممکن است ۵ تا ۱۵ دقیقه تأخیر داشته باشد (طبیعی است).
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "حداکثر تعداد ارسال در این اجرا (خالی = نامحدود)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: torrent-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check state branch
        id: state_branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout state branch
        if: steps.state_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: state
          path: .state
          fetch-depth: 1

      - name: Create state branch
        if: steps.state_branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .state
          cd .state
          git init -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -q --allow-empty -m "init state"
          git push -q -u origin state

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          STATE_DIR: .state
          STATE_GIT_DIR: .state
          LIMIT: ${{ inputs.limit }}
          RUN_BUDGET_SECONDS: "1500"   # ۲۵ دقیقه سقف کل اجرا
          SEARCH_BUDGET_SECONDS: "300" # ۵ دقیقه سقف جستجو
        run: python main.py

      - name: Persist state
        if: always()
        run: |
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q --amend -m "state $(date -u +%FT%TZ)" \
              || git commit -q -m "state $(date -u +%FT%TZ)"
          fi
          # Always push: the script may have committed locally but failed to push.
          git push -q --force origin HEAD:state
